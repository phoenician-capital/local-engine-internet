services:
  engine:
    build: .
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-}
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    profiles: ["searxng"]
    ports:
      - "8888:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    restart: unless-stopped
