[project]
name = "local-engine-internet"
version = "0.1.0"
description = "Internet search + fetch for Phoenician local LLMs. OpenAI-compatible drop-in."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "brotli>=1.1",
    "prometheus-client>=0.21",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "trafilatura>=1.12",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "curl_cffi>=0.7",
    "playwright>=1.49",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
local-engine = "engine.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
